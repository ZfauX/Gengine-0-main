# .github/workflows/go.yml
name: Go CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: latest
  DOCKER_IMAGE_NAME: gengine
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "РІСњРЉ Files not formatted:"
            gofmt -l .
            exit 1
          fi
          echo "РІСљвЂ¦ All files formatted"

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (short mode)
        run: go test -v -race -count=1 -short -coverprofile=coverage-unit.out ./internal/...

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit.out

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests with coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: testdb
          DB_SSLMODE: disable
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long
          SESSION_SECRET: test-session-secret-at-least-32-chars
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: adminpass123
        run: go test -v -race -count=1 -tags=integration -coverprofile=coverage-integration.out ./cmd/server/...

      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.out

  build:
    name: Build & Race
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -race ./...

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    # GITHUB_TOKEN Р С—Р С• РЎС“Р СР С•Р В»РЎвЂЎР В°Р Р…Р С‘РЎР‹ Р С‘Р СР ВµР ВµРЎвЂљ read-only Р Т‘Р С•РЎРѓРЎвЂљРЎС“Р С— Р С” packages РІР‚вЂќ Р В±Р ВµР В· write
    # push Р Р† GHCR Р С—Р В°Р Т‘Р В°Р ВµРЎвЂљ РЎРѓ 'denied: installation not allowed to Create
    # organization package'.
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        # GHCR РЎвЂљРЎР‚Р ВµР В±РЎС“Р ВµРЎвЂљ Р С‘Р СР ВµР Р…Р В° РЎР‚Р ВµР С—Р С•Р В·Р С‘РЎвЂљР С•РЎР‚Р С‘Р ВµР Р† Р Р† Р Р…Р С‘Р В¶Р Р…Р ВµР С РЎР‚Р ВµР С–Р С‘РЎРѓРЎвЂљРЎР‚Р Вµ (ghcr.io/owner/image).
        # github.repository_owner Р СР С•Р В¶Р ВµРЎвЂљ РЎРѓР С•Р Т‘Р ВµРЎР‚Р В¶Р В°РЎвЂљРЎРЉ Р В·Р В°Р С–Р В»Р В°Р Р†Р Р…РЎвЂ№Р Вµ Р В±РЎС“Р С”Р Р†РЎвЂ№ (ZfauX),
        # Р С—Р С•РЎРЊРЎвЂљР С•Р СРЎС“ Р С—РЎР‚Р С‘Р Р†Р С•Р Т‘Р С‘Р С Р ВµР С–Р С• Р С” Р Р…Р С‘Р В¶Р Р…Р ВµР СРЎС“ РЎР‚Р ВµР С–Р С‘РЎРѓРЎвЂљРЎР‚РЎС“ РЎвЂЎР ВµРЎР‚Р ВµР В· bash-Р С—Р С•Р Т‘РЎРѓРЎвЂљР В°Р Р…Р С•Р Р†Р С”РЎС“.
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max