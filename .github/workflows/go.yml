# .github/workflows/go.yml
name: Go CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  # 1.25.13 — патч с фиксами stdlib уязвимостей (GO-2026-6088..6218):
  # net/url, html/template, crypto/tls, net/http, encoding/xml, encoding/asn1,
  # x/net/idna. '1.25' резолвится в уязвимую 1.25.12 — govulncheck падает.
  GO_VERSION: '1.25.13'
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: latest
  DOCKER_IMAGE_NAME: gengine
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi
          echo "All files formatted"

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # UX-6 (PASS-16): gitleaks — блокирует коммиты с секретами/ключами
      # (закоммиченные .key, JWT/DB пароли, test-секреты, попавшие в прод).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (short mode)
        run: go test -v -race -count=1 -short -coverprofile=coverage-unit.out ./internal/...

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit.out

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests with coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: testdb
          DB_SSLMODE: disable
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long
          SESSION_SECRET: test-session-secret-at-least-32-chars
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: adminpass123
        run: go test -v -race -count=1 -tags=integration -coverprofile=coverage-integration.out ./cmd/server/...

      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.out

  build:
    name: Build & Race
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -race ./...

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gengine
          POSTGRES_PASSWORD: gengine
          POSTGRES_DB: gengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 deprecated на GitHub runners (2025-09) — используют 24.
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Create e2e database (gengine_e2e)
        env:
          PGPASSWORD: gengine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U gengine -d gengine -v ON_ERROR_STOP=1 -c "CREATE DATABASE gengine_e2e;"

      - name: Create .env.e2e
        # APP_ENV_FILE указывает серверу читать .env.e2e, а не .env:
        # иначе из .env подхватываются TLS_*/TRUSTED_PROXIES → CSRF-кука Secure → 403 на HTTP.
        run: |
          cat > .env.e2e <<'EOF'
          PORT=8081
          SERVER_BASE_URL=http://localhost:8081
          GIN_MODE=release
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=gengine
          DB_PASSWORD=gengine
          DB_NAME=gengine_e2e
          DB_SSLMODE=disable
          JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef
          SESSION_SECRET=ci-session-secret-0123456789abcdef0123456789abcdef
          ADMIN_EMAIL=admin@e2e.test
          ADMIN_PASSWORD=AdminE2E123456!
          SMTP_ENABLED=false
          VALKEY_HOST=
          VALKEY_PORT=
          WEBAUTHN_RPID=localhost
          FORCE_SECURE_COOKIE=false
          RATE_LIMIT_GLOBAL=100000
          RATE_LIMIT_LOGIN=100000
          RATE_LIMIT_REGISTRATION=100000
          RATE_LIMIT_CODE_SUBMISSION=100000
          RATE_LIMIT_SSE=100000
          RATE_LIMIT_API=100000
          RATE_LIMIT_PASSWORD_RESET=100000
          EOF

      - name: Build server binary
        run: go build -o gengine ./cmd/server

      - name: Run migrations (gengine_e2e)
        env:
          APP_ENV_FILE: .env.e2e
        run: ./gengine -migrate

      - name: Start server on :8081
        env:
          APP_ENV_FILE: .env.e2e
        run: |
          nohup ./gengine > e2e-server.log 2>&1 &
          echo "server pid: $!"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null 2>&1; then
              echo "server is up (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start" >&2
          cat e2e-server.log >&2 || true
          exit 1

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        # v7 (не v4 — v4 таргетирует Node 20, deprecated на GitHub runners).
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    # GITHUB_TOKEN по умолчанию имеет read-only доступ к packages — без write
    # push в GHCR падает с 'denied: installation not allowed to Create
    # organization package'.
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        # GHCR требует имя репозитория в нижнем регистре (ghcr.io/owner/image).
        # github.repository_owner может содержать заглавные буквы (ZfauX),
        # поэтому приводим его к нижнему регистру через bash-подстановку.
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
