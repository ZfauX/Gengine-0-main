name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gengine_test
          POSTGRES_USER: gengine
          POSTGRES_PASSWORD: gengine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Lint
      run: golangci-lint run ./...

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    - name: Short tests
      run: go test -short -count=1 ./...

    - name: Integration tests
      run: go test -tags=integration -count=1 -v ./cmd/server/...
      env:
        TEST_DATABASE_URL: postgres://gengine:gengine@localhost:5432/gengine_test?sslmode=disable
