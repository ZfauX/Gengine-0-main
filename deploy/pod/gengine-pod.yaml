# deploy/pod/gengine-pod.yaml
#
# Pod Gengine-0: app + PostgreSQL + Valkey в одном pod (общий network namespace).
# Контейнеры общаются через localhost. Запуск:
#   podman play kube deploy/pod/gengine-pod.yaml
#   podman pod start gengine-pod
#
# ВНИМАНИЕ: секреты (DB_PASSWORD, JWT_SECRET) для теста. В production —
# через k8s Secrets / podman secret.

apiVersion: v1
kind: Pod
metadata:
  name: gengine-pod
  labels:
    app: gengine
spec:
  containers:
    # ---------- PostgreSQL ----------
    - name: db
      image: docker.io/library/postgres:18-alpine
      env:
        - name: POSTGRES_USER
          value: gengine
        # M5 (PASS-15): тестовый пароль! В production — podman secret / k8s
        # Secrets / envFrom. НЕ копируйте в прод без замены.
        - name: POSTGRES_PASSWORD
          value: gengine
        - name: POSTGRES_DB
          value: gengine
        # PostgreSQL 18: PGDATA в подкаталоге (mount на /var/lib/postgresql)
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "gengine"]
        initialDelaySeconds: 5
        periodSeconds: 5

    # ---------- Valkey ----------
    - name: valkey
      image: docker.io/valkey/valkey:7.2-alpine
      args: ["valkey-server", "--appendonly", "yes"]
      volumeMounts:
        - name: valkeydata
          mountPath: /data
      readinessProbe:
        exec:
          command: ["valkey-cli", "ping"]
        initialDelaySeconds: 3
        periodSeconds: 5

    # ---------- App ----------
    - name: app
      image: localhost/gengine:test
      ports:
        - containerPort: 8080
          hostPort: 8080
      env:
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: gengine
        - name: DB_PASSWORD
          value: gengine
        - name: DB_NAME
          value: gengine
        - name: DB_SSLMODE
          value: disable
        - name: VALKEY_HOST
          value: 127.0.0.1
        - name: VALKEY_PORT
          value: "6379"
        - name: BASE_URL
          value: https://172.30.73.28:8080
        # M5 (PASS-15): ТЕСТОВЫЕ секреты/админ-пароль. В production —
        # podman secret / k8s Secrets. RATE_LIMIT_*=100000 и PPROF — только
        # для тестов; в прод уберите PPROF_ENABLED и поставьте реальные лимиты.
        - name: JWT_SECRET
          value: pod-jwt-secret-0123456789abcdef0123456789abcdef
        - name: SESSION_SECRET
          value: pod-session-secret-0123456789abcdef0123456789abcdef
        - name: ADMIN_EMAIL
          value: admin@pod.test
        - name: ADMIN_PASSWORD
          value: AdminPod123456!
        - name: SMTP_ENABLED
          value: "false"
        - name: RATE_LIMIT_GLOBAL
          value: "100000"
        - name: RATE_LIMIT_LOGIN
          value: "100000"
        - name: RATE_LIMIT_REGISTRATION
          value: "100000"
        - name: RATE_LIMIT_CODE_SUBMISSION
          value: "100000"
        - name: RATE_LIMIT_SSE
          value: "100000"
        - name: RATE_LIMIT_API
          value: "100000"
        # M4 (PASS-15): JSON-логи — console-формат zerolog тратит ~10% CPU
        # (ANSI + посимвольное форматирование) в контейнере, где вывод и так
        # собирается podman/k8s-рантаймом.
        - name: LOG_FORMAT
          value: json
        # pprof (P-1, PASS-13): отдельный debug-сервер на 127.0.0.1:6060.
        # Включать только для профилирования (не в production).
        - name: PPROF_ENABLED
          value: "true"
        - name: PPROF_PORT
          value: "6060"
        # TrustedProxies пуст → Secure-флаг cookie=false (работает по HTTP)
        # TLS (HTTPS-проверка): самоподписанный сертификат в deploy/certs.
        # При заданных TLS_CERT_FILE/TLS_KEY_FILE сервер включает HTTPS.
        # В production — реальный сертификат (Let's Encrypt / k8s ingress).
        - name: TLS_CERT_FILE
          value: /certs/server.crt
        - name: TLS_KEY_FILE
          value: /certs/server.key
      volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: backups
          mountPath: /app/backups
        - name: certs
          mountPath: /certs
          readOnly: true
      readinessProbe:
        exec:
          command: ["wget", "--spider", "-q", "https://localhost:8080/healthz", "--no-check-certificate"]
        initialDelaySeconds: 10
        periodSeconds: 10

  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: gengine-pgdata
    - name: valkeydata
      persistentVolumeClaim:
        claimName: gengine-valkeydata
    - name: uploads
      emptyDir: {}
    - name: backups
      emptyDir: {}
    - name: certs
      # TLS-сертификат (deploy/certs/server.{crt,key}). В podman hostPath
      # указывает на каталог внутри VM; в k8s — секрет/volume.
      hostPath:
        path: /app/certs
        type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gengine-pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gengine-valkeydata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
