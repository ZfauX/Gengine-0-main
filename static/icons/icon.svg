<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#ring)" stroke-width="8"/>
  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Compass/quest marker - outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <!-- Cardinal direction lines -->
  <line x1="256" y1="96" x2="256" y2="160" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="352" x2="256" y2="416" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="256" x2="160" y2="256" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="352" y1="256" x2="416" y2="256" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <!-- Compass arrow - North (blue) -->
  <polygon points="256,120 236,200 256,180 276,200" fill="#93c5fd" opacity="0.9"/>
  <!-- Compass arrow - South (lighter) -->
  <polygon points="256,392 236,312 256,332 276,312" fill="rgba(255,255,255,0.4)"/>
  <!-- Compass arrow - East -->
  <polygon points="392,256 312,236 332,256 312,276" fill="rgba(255,255,255,0.4)"/>
  <!-- Compass arrow - West -->
  <polygon points="120,256 200,236 180,256 200,276" fill="rgba(255,255,255,0.4)"/>
  <!-- Center circle -->
  <circle cx="256" cy="256" r="80" fill="rgba(255,255,255,0.95)"/>
  <!-- Letter "G" -->
  <text x="256" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">G</text>
</svg>
