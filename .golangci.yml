# .golangci.yml — конфигурация golangci-lint v2
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck       # unchecked error returns
    - govet          # Go compiler warnings
    - staticcheck    # advanced static analysis (включает gosimple в v2)
    - unused         # unused code
    - misspell       # misspellings
    - ineffassign    # ineffective assignments
    - nakedret       # naked returns
    - unconvert      # unnecessary conversions
    - wastedassign   # wasted assignments
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks: ["all", "-ST1000", "-ST1005", "-QF1001", "-QF1002"]
    misspell:
      locale: US
  exclusions:
    rules:
      # Пропускаем проверки в тестах (как в v1-конфиге: тестовый код — не прод).
      - path: _test\.go
        linters:
          - errcheck
          - ineffassign
          - nakedret
          - unused
          - unconvert
          - wastedassign
          - misspell

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
