{{define "errors-429.html"}}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl mb-6">⏳</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ T $.Lang "error.429_title" }}</h1>
        {{if .Error}}<p class="text-red-600 mb-2">{{.Error}}</p>{{end}}
        <p class="text-sm text-gray-400 dark:text-gray-500 mb-6">{{ T $.Lang "error.429_message" }}</p>
        <div class="flex flex-wrap gap-3 justify-center">
            <a href="/" class="btn btn-primary text-sm inline-block">{{ T $.Lang "error.home" }}</a>
            <button id="btn-back" class="btn btn-outline text-sm inline-block">{{ T $.Lang "error.back" }}</button>
        </div>
    </div>
</div>
<script nonce="{{.csp_nonce}}">document.getElementById('btn-back').addEventListener('click',function(){history.back()});</script>
{{end}}
