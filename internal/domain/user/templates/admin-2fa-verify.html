{{define "admin-2fa-verify.html"}}
<div class="max-w-md mx-auto mt-10">
    <div class="card p-8">
        <h1 class="page-title text-center mb-6">{{ T $.Lang "twofa.admin_verify_title" }}</h1>

        <p class="text-sm text-gray-600 dark:text-gray-400 text-center mb-6">
            {{.Message}}
        </p>

        {{if .Error}}
        <div class="flash flash-error mb-4">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/auth/2fa/verify" class="space-y-4">
            <input type="hidden" name="_csrf" value="{{.csrf}}">
            <input type="hidden" name="return_url" value="{{.ReturnURL}}">

            <div>
                <label for="code" class="form-label">{{ T $.Lang "twofa.admin_code_label" }}</label>
                <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required
                       class="form-input text-center text-2xl tracking-widest" placeholder="000000">
            </div>

            <!-- UX-2 (PASS-13): «запомнить это устройство на 30 дней» -->
            <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 cursor-pointer">
                <input type="checkbox" name="remember_device" value="1" class="rounded border-gray-300 dark:border-gray-600">
                {{ T $.Lang "twofa.remember_device" }}
            </label>

            <button type="submit" class="btn btn-primary w-full">{{ T $.Lang "twofa.admin_verify_button" }}</button>
        </form>

        <div class="mt-6 text-center">
            <a href="/auth/2fa/backup" class="text-sm text-primary-600 dark:text-primary-400 hover:underline">
                {{ T $.Lang "twofa.admin_backup_link" }}
            </a>
        </div>
    </div>
</div>
{{end}}
