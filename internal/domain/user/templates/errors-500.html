{{define "errors-500.html"}}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl mb-6" aria-hidden="true">😵</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ T $.Lang "error.500_title" }}</h1>
        <!-- A-2 (pass 33): не выводим .Error — это может быть сырой Go-err
             (пути/внутренности). Пользователь получает общее сообщение. -->
        <p class="text-gray-600 dark:text-gray-400 mb-2">{{ T $.Lang "error.500_message" }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-500 mb-6">{{ T $.Lang "error.500_hint" }}</p>
        <div class="flex flex-wrap gap-3 justify-center">
            <a href="/" class="btn btn-primary text-sm inline-block">{{ T $.Lang "error.home" }}</a>
            <button id="btn-reload" class="btn btn-outline text-sm inline-block">{{ T $.Lang "error.refresh" }}</button>
            <button id="btn-back" class="btn btn-outline text-sm inline-block">{{ T $.Lang "error.back" }}</button>
        </div>
    </div>
</div>
<script nonce="{{.csp_nonce}}">
document.getElementById('btn-reload').addEventListener('click',function(){location.reload()});
document.getElementById('btn-back').addEventListener('click',function(){history.back()});
</script>
{{end}}
