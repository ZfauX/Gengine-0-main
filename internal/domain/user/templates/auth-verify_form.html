{{define "auth-verify_form.html"}}
<div class="max-w-md mx-auto">
    <h1 class="page-title">{{ T $.Lang "auth.verify_email_title" }}</h1>

    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <div class="card">
        <form action="/auth/verify" method="POST" class="space-y-4">
            <input type="hidden" name="_csrf" value="{{.csrf}}">
            <div>
                <label for="code" class="form-label">{{ T $.Lang "auth.verify_code_label" }}</label>
                <input type="text" name="code" id="code" required autocomplete="one-time-code"
                       placeholder="XXXX-XXXX" maxlength="16"
                       class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-500 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>
            <button type="submit" class="w-full btn btn-primary text-sm">{{ T $.Lang "auth.verify_button" }}</button>
        </form>
        <p class="mt-4 text-sm text-gray-500 dark:text-gray-400">{{ T $.Lang "auth.verify_code_hint" }}</p>
    </div>
</div>
{{end}}
