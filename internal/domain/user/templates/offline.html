{{define "offline.html"}}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card text-center max-w-md">
        <div class="text-6xl mb-4">📡</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-2">Нет соединения</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">Проверьте подключение к интернету и попробуйте снова.</p>
        <button id="reconnect-btn" class="btn btn-primary">🔄 Попробовать снова</button>
    </div>
    <script nonce="{{.csp_nonce}}">
    document.getElementById('reconnect-btn').addEventListener('click', function() { window.location.reload(); });
    </script>
</div>
{{end}}
