{{define "offline.html"}}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card text-center max-w-md">
        <div class="text-6xl mb-4" aria-hidden="true">📡</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-2">{{ T $.Lang "offline.title" }}</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">{{ T $.Lang "offline.message" }}</p>
        <!-- UX-14 (pass 42): type=button — явный тип, не полагаемся на дефолт -->
        <button id="reconnect-btn" type="button" class="btn btn-primary">{{ T $.Lang "offline.retry" }}</button>
    </div>
    <script nonce="{{.csp_nonce}}">
    document.getElementById('reconnect-btn').addEventListener('click', function() { window.location.reload(); });
    </script>
</div>
{{end}}
