{{define "auth-forgot.html"}}
<div class="max-w-md mx-auto">
    <h1 class="page-title">{{ T $.Lang "auth.forgot_title" }}</h1>

    {{if .Message}}
    <div class="flash flash-success">{{.Message}}</div>
    {{end}}
    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <div class="card">
        <form action="/auth/forgot" method="POST" class="space-y-4">
            <input type="hidden" name="_csrf" value="{{.csrf}}">

            <div>
                <label for="email" class="form-label">{{ T $.Lang "auth.forgot_email_label" }}</label>
                <input type="email" name="email" id="email" required
                       class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm {{if .Errors.Email}}border-red-500{{end}}"
                       >
                {{if .Errors.Email}}{{if .Errors.Email}}<p class="field-error">{{.Errors.Email}}</p>{{end}}{{end}}
            </div>

            <button type="submit" class="w-full btn btn-primary text-sm">{{ T $.Lang "auth.forgot_submit" }}</button>
        </form>
    </div>

    <div class="mt-4 text-center">
        <a href="/auth/login" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">{{ T $.Lang "auth.back_to_login" }}</a>
    </div>
</div>
{{end}}
