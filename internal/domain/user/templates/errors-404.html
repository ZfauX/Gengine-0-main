{{define "errors-404.html"}}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl mb-6">🔍</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ T $.Lang "error.404_title" }}</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-2">{{ T $.Lang "error.404_message" }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-500 mb-6">{{ T $.Lang "error.404_hint" }}</p>
        <div class="flex flex-wrap gap-3 justify-center">
            <a href="/" class="btn btn-primary text-sm inline-block">{{ T $.Lang "error.home" }}</a>
            <a href="/games" class="btn btn-outline text-sm inline-block">{{ T $.Lang "error.to_games" }}</a>
            <button id="btn-back" class="btn btn-outline text-sm inline-block">{{ T $.Lang "error.back" }}</button>
        </div>

        <!-- C10: поиск игры прямо со страницы 404 -->
        <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-3">{{ T $.Lang "error.search_label" }}</p>
            <form action="/games" method="GET" class="flex gap-2 justify-center">
                <input type="text" name="search" placeholder="{{ T $.Lang "common.search" }}" autocomplete="off"
                       class="w-full max-w-xs rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-500 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
                <button type="submit" class="btn btn-primary text-sm whitespace-nowrap">{{ T $.Lang "common.search" }}</button>
            </form>
        </div>
    </div>
</div>
<script nonce="{{.csp_nonce}}">document.getElementById('btn-back').addEventListener('click',function(){history.back()});</script>
{{end}}
