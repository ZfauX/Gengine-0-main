{{define "user-2fa-disable.html"}}
<div class="max-w-lg mx-auto">
    <h1 class="page-title">{{ T $.Lang "twofa.disable_title" }}</h1>

    {{if .Error}}
    <div class="flash flash-error mb-4">{{.Error}}</div>
    {{end}}

    <div class="card">
        <div class="text-center mb-6">
            <div class="text-4xl mb-3">🔓</div>
            <p class="text-gray-600 dark:text-gray-400">
                {{ T $.Lang "twofa.disable_confirm" }}
            </p>
        </div>

        <form action="/user/2fa/disable" method="POST" class="space-y-4">
            <input type="hidden" name="_csrf" value="{{.csrf}}">

            <div>
                <label for="password" class="form-label">{{ T $.Lang "twofa.password_confirm_label" }}</label>
                <input type="password" name="password" id="password" required autocomplete="current-password"
                       placeholder="{{ T $.Lang "twofa.password_placeholder" }}"
                       class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="code" class="form-label">{{ T $.Lang "twofa.code_label" }}</label>
                <input type="text" name="code" id="code" required inputmode="numeric" autocomplete="one-time-code"
                       placeholder="{{ T $.Lang "twofa.code_placeholder" }}"
                       class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <button type="submit" id="disableBtn" class="w-full btn bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-md transition-colors">
                {{ T $.Lang "twofa.disable_button" }}
            </button>
        </form>

        <script nonce="{{.csp_nonce}}">
            document.querySelector('form').addEventListener('submit', function() {
                var btn = document.getElementById('disableBtn');
                btn.disabled = true;
                btn.textContent = '{{ T $.Lang "twofa.disabling" }}';
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });
        </script>
    </div>

    <div class="mt-4 text-center text-sm">
        <a href="/profile" class="text-blue-600 dark:text-blue-400 hover:underline">{{ T $.Lang "profile.go_to_dashboard" }}</a>
    </div>
</div>
{{end}}
