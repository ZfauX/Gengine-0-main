{{define "webauthn-login-button.html"}}
<button id="passkey-login-btn" type="button"
        class="w-full btn text-sm bg-green-600 dark:bg-green-700 hover:bg-green-700 dark:hover:bg-green-800 text-white px-4 py-2 rounded-md">
    {{ T $.Lang "passkey.login_button" }}
</button>

<script nonce="{{.csp_nonce}}">
function loginWithPasskey() {
    const btn = document.getElementById('passkey-login-btn');
    btn.disabled = true;
    btn.textContent = '{{ T $.Lang "auth.login_passkey_waiting" }}';

    if (!navigator.credentials || !navigator.credentials.get) {
        window.showToast('{{ T $.Lang "passkey.not_supported" }}', 'error');
        btn.disabled = false;
        btn.textContent = '{{ T $.Lang "passkey.login_button" }}';
        return;
    }

    fetch('/auth/webauthn/login/begin', { method: 'POST' })
    .then(r => r.json())
    .then(assertion => {
        var opts = assertion.publicKey || assertion;
        opts.challenge = base64ToArrayBuffer(opts.challenge);
        if (opts.allowCredentials) {
            opts.allowCredentials.forEach(function(c) {
                c.id = base64ToArrayBuffer(c.id);
            });
        }
        return navigator.credentials.get({ publicKey: opts });
    })
    .then(credential => {
        const body = {
            id: credential.id,
            type: credential.type,
            rawId: arrayBufferToBase64(credential.rawId),
            response: {
                clientDataJSON: arrayBufferToBase64(credential.response.clientDataJSON),
                authenticatorData: arrayBufferToBase64(credential.response.authenticatorData),
                signature: arrayBufferToBase64(credential.response.signature),
                userHandle: credential.response.userHandle ? arrayBufferToBase64(credential.response.userHandle) : null
            },
            clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {}
        };
        return fetch('/auth/webauthn/login/finish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    })
    .then(r => r.json())
    .then(data => {
        // S-H1: если включена 2FA — passkey только первый фактор, идём на TOTP.
        // MED-11: редирект принимаем только same-origin (защита в глубину).
        if (data.status === '2fa_required' && data.redirect && isSameOrigin(data.redirect)) {
            window.location.href = data.redirect;
            return;
        }
        if (data.status === 'ok' && data.redirect && isSameOrigin(data.redirect)) {
            window.location.href = data.redirect;
        } else if (data.status === 'ok') {
            window.location.reload();
        } else {
            window.showToast('{{ T $.Lang "passkey.error_prefix" }}' + (data.error || '{{ T $.Lang "generic.unknown_error" }}'), 'error');
            btn.disabled = false;
            btn.textContent = '{{ T $.Lang "passkey.login_button" }}';
        }
    })
    .catch(err => {
        console.error(err);
        window.showToast('{{ T $.Lang "passkey.error_prefix" }}' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '{{ T $.Lang "passkey.login_button" }}';
    });
}

// MED-11: same-origin проверка для редиректов.
function isSameOrigin(url) {
    try {
        return new URL(url, window.location.href).origin === window.location.origin;
    } catch (e) {
        return false;
    }
}

    document.getElementById('passkey-login-btn').addEventListener('click', loginWithPasskey);

function base64ToArrayBuffer(base64) {
    var binary = atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
}

function arrayBufferToBase64(buf) {
    const bytes = new Uint8Array(buf);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}
</script>
{{end}}
