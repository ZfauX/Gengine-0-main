{{define "errors-503.html"}}
<div class="text-center py-16">
    <div class="text-6xl mb-4">🔧</div>
    <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ T $.Lang "error.503_title" }}</h1>
    <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto">
        {{ T $.Lang "error.503_message" }}
    </p>
    <div class="flex justify-center gap-4">
        <a href="/" class="btn btn-primary">{{ T $.Lang "error.home" }}</a>
        <button id="btn-retry" class="btn btn-outline">{{ T $.Lang "error.refresh" }}</button>
    </div>
    <script nonce="{{.csp_nonce}}">
        document.getElementById('btn-retry')?.addEventListener('click', function() { window.location.reload(); });
    </script>
</div>
{{end}}
