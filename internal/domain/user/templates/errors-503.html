{{define "errors-503.html"}}
<div class="text-center py-16">
    <div class="text-6xl mb-4">🔧</div>
    <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">503 — Сервис недоступен</h1>
    <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto">
        Ведутся технические работы. Пожалуйста, попробуйте позже.
    </p>
    <div class="flex justify-center gap-4">
        <a href="/" class="btn btn-primary">На главную</a>
        <button id="btn-retry" class="btn btn-outline">Обновить</button>
    </div>
    <script nonce="{{.csp_nonce}}">
        document.getElementById('btn-retry')?.addEventListener('click', function() { window.location.reload(); });
    </script>
</div>
{{end}}
