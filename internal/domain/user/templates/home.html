{{define "home.html"}}
<div class="max-w-4xl mx-auto text-center py-12">
    <h1 class="text-4xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ T $.Lang "home.title" }}</h1>
    <p class="text-xl text-gray-600 dark:text-gray-400 mb-8">{{ T $.Lang "home.subtitle" }}</p>
    
    <!-- Search bar -->
    <div class="max-w-xl mx-auto mb-8">
        <form action="/games" method="GET" class="flex gap-2">
            <label for="home-search" class="sr-only">{{ T $.Lang "home.search_placeholder" }}</label>
            <input id="home-search" type="text" name="search" placeholder="{{ T $.Lang "home.search_placeholder" }}" 
                   class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500">
            <button type="submit" class="btn btn-primary px-6">{{ T $.Lang "home.search_button" }}</button>
        </form>
    </div>
    
    {{if .CurrentUserID}}
        <div class="flex flex-wrap justify-center gap-3">
            <a href="/dashboard" class="btn btn-primary text-sm">{{ T $.Lang "home.dashboard" }}</a>
            <a href="/games" class="btn btn-outline text-sm">{{ T $.Lang "home.games" }}</a>
            <a href="/teams" class="btn btn-outline text-sm">{{ T $.Lang "home.teams" }}</a>
        </div>
    {{else}}
        <div class="flex flex-wrap justify-center gap-3">
            <a href="/auth/login" class="btn btn-primary text-sm">{{ T $.Lang "home.login" }}</a>
            <a href="/auth/register" class="btn btn-outline text-sm">{{ T $.Lang "home.register" }}</a>
        </div>
    {{end}}
</div>
{{end}}
