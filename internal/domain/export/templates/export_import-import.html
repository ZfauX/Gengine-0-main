{{define "export_import-import.html"}}
<div class="max-w-7xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "export.title" }}</h1>

    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <div class="card mb-6">
        <form action="/games/{{.GameID}}/import" method="POST" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="_csrf" value="{{.csrf}}">

            <div>
                <label for="csvfile" class="form-label">{{ T $.Lang "export.csv_label" }}</label>
                <input type="file" name="csvfile" id="csvfile" accept=".csv" required
                       class="w-full text-sm text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <button type="submit" class="btn btn-primary text-sm">{{ T $.Lang "export.upload_button" }}</button>
        </form>
    </div>

    <hr class="my-6 border-gray-200 dark:border-gray-700">

    <div class="text-sm text-gray-600 dark:text-gray-400 space-y-2">
        <p><span class="font-medium">{{ T $.Lang "export.csv_format" }}</span> {{ T $.Lang "export.csv_desc" }}</p>
        <p>
            <a href="/games/{{.GameID}}/export" download class="btn btn-outline text-sm">{{ T $.Lang "export.download_csv" }}</a>
        </p>
    </div>
</div>
{{end}}
