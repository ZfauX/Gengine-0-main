{{define "logs-list.html"}}
<div class="max-w-4xl mx-auto" data-game-id="{{.GameID}}" data-page="{{.Page}}">
    <h1 class="page-title">{{ T $.Lang "logs.title" }}</h1>

    <div class="card">
        <ul id="log-list" role="log" aria-live="polite" aria-relevant="additions" class="divide-y divide-gray-100 max-h-[70vh] overflow-y-auto" data-total-pages="{{.TotalPages}}">
            {{range .Logs}}
            <li class="py-2 text-sm text-gray-700 dark:text-gray-300">{{ formatTime $.TZOffset .CreatedAt }} — {{.Message}}</li>
            {{else}}
            <li class="py-2 text-sm text-gray-500 dark:text-gray-400">{{ T $.Lang "logs.no_logs" }}</li>
            {{end}}
        </ul>
        <div id="pagination" class="flex items-center justify-center gap-2 mt-4 text-sm {{if le .TotalPages 1}}hidden{{end}}">
            <button id="prev-page" class="px-3 py-1 border rounded hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-40" {{if le .Page 1}}disabled{{end}}>{{ T $.Lang "logs.prev" }}</button>
            <span id="current-page" class="px-2 text-gray-600 dark:text-gray-400">{{ TF $.Lang "logs.page" .Page .TotalPages }}</span>
            <button id="next-page" class="px-3 py-1 border rounded hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-40" {{if ge .Page .TotalPages}}disabled{{end}}>{{ T $.Lang "logs.next" }}</button>
        </div>
        <div id="connection-status" role="status" aria-live="polite" class="mt-3 text-sm text-gray-500 dark:text-gray-400"></div>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
    (function() {
        const container = document.querySelector('[data-game-id]');
        if (!container) return;

        const gameID = container.dataset.gameId;
        const totalPages = parseInt(document.getElementById('log-list')?.dataset.totalPages || '1', 10);
        // U-1: currentPage из data-page (раньше текст спан не парсился → NaN).
        let currentPage = parseInt(container.dataset.page || '1', 10);

        // Pagination
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const paginationEl = document.getElementById('pagination');

        function loadPage(page) {
            if (page < 1 || page > totalPages) return;
            // UX-M5 (pass 32): блокируем кнопки во время загрузки + .catch.
            if (prevBtn) prevBtn.disabled = true;
            if (nextBtn) nextBtn.disabled = true;
            fetch('/games/' + gameID + '/logs?page=' + page + '&per_page=50', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(function(r) { return r.text(); })
                .then(function(html) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const newList = doc.getElementById('log-list');
                    if (newList) {
                        document.getElementById('log-list').innerHTML = newList.innerHTML;
                        // Сохраняем формат «Стр. X из Y», обновляя только номер.
                        const pageSpan = document.getElementById('current-page');
                        if (pageSpan) pageSpan.textContent = pageSpan.textContent.replace(/\d+/, String(page));
                        currentPage = page;
                    }
                    if (prevBtn) prevBtn.disabled = currentPage <= 1;
                    if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
                })
                .catch(function() {
                    if (prevBtn) prevBtn.disabled = currentPage <= 1;
                    if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
                });
        }

        if (prevBtn) prevBtn.addEventListener('click', function() { loadPage(currentPage - 1); });
        if (nextBtn) nextBtn.addEventListener('click', function() { loadPage(currentPage + 1); });
    })();
</script>
{{end}}
