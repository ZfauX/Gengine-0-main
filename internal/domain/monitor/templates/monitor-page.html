{{define "monitor-page.html"}}
<div class="max-w-7xl mx-auto" data-game-id="{{.GameID}}">
    <h1 class="page-title">{{ T $.Lang "monitor.page_title" }}</h1>

    <div class="card">
        <div id="teams-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Карточки команд будут отображаться здесь -->
        </div>
        <div id="connection-status" class="mt-4 text-sm text-gray-500 dark:text-gray-400"></div>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
    (function() {
        const container = document.querySelector('[data-game-id]');
        if (!container) return;

        const gameID = container.dataset.gameId;
        const csrfToken = '{{.csrf}}';
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${location.host}/games/${gameID}/monitor/ws`;
        let wsClient = null;
        let teamsData = [];
        const MAX_RECONNECT_ATTEMPTS = 5;
        const POLL_INTERVAL = 10000;

        const teamsContainer = document.getElementById('teams-container');
        const statusEl = document.getElementById('connection-status');
        let pollingTimer = null;
        let wsConnected = false;

        function updateConnectionStatus(text, color = '#888') {
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.style.color = color;
            }
        }

        function connect() {
            if (wsConnected) return;
            if (wsClient) wsClient.close();

            // Единый reconnecting-клиент (UX15). После исчерпания попыток
            // onFinalClose переключает монитор на polling.
            wsClient = window.createReconnectingWebSocket(wsUrl, {
                maxAttempts: MAX_RECONNECT_ATTEMPTS,
                onMessage: function(e) {
                    try {
                        const data = JSON.parse(e.data);
                        // Проверяем, является ли это уведомлением о старте игры
                        if (data && data.type === 'game_started') {
                            handleGameStartedNotification(data);
                            return;
                        }
                        // Иначе это snapshot данных мониторинга
                        teamsData = data;
                        renderTeams();
                    } catch (err) {
                        console.error('Monitor: parse error', err);
                    }
                },
                onStatus: function(name) {
                    if (name === 'connected') {
                        wsConnected = true;
                        updateConnectionStatus('{{ T $.Lang "monitor.connected" }}', '#2ecc71');
                        stopPolling();
                    } else if (name === 'reconnecting') {
                        wsConnected = false;
                        updateConnectionStatus('{{ T $.Lang "monitor.reconnecting" }}', '#e67e22');
                    } else if (name === 'error') {
                        updateConnectionStatus('{{ T $.Lang "monitor.error_connecting" }}', '#e74c3c');
                    } else if (name === 'failed') {
                        wsConnected = false;
                        updateConnectionStatus('{{ T $.Lang "monitor.switching_polling" }}', '#e67e22');
                        startPolling();
                    }
                },
                onFinalClose: function() {
                    wsConnected = false;
                }
            });
        }

        // Polling fallback
        function startPolling() {
            stopPolling();
            fetchInitialData();
            pollingTimer = setInterval(fetchInitialData, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
            }
        }

        function fetchInitialData() {
            fetch(`/games/${gameID}/monitor/data`, {
                headers: { 'X-CSRF-TOKEN': csrfToken }
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                teamsData = data.teams || data || [];
                renderTeams();
                updateConnectionStatus('{{ T $.Lang "monitor.polling" }}', '#3498db');
                // Try reconnecting WS in background
                if (!wsConnected) {
                    connect();
                }
            })
            .catch(err => {
                console.error('Monitor: polling error', err);
                updateConnectionStatus('{{ T $.Lang "monitor.fetch_error" }}', '#e74c3c');
            });
        }

        function formatTime(seconds) {
            if (seconds <= 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function renderTeams() {
            teamsContainer.innerHTML = '';
            if (!teamsData || teamsData.length === 0) {
                teamsContainer.innerHTML = `<div class="col-span-full text-center text-gray-500 dark:text-gray-400 py-8">{{ T $.Lang "monitor.no_data" }}</div>`;
                return;
            }

            teamsData.forEach(team => {
                const progressPercent = team.total_levels > 0 ? (team.completed_levels / team.total_levels * 100) : 0;
                const card = document.createElement('div');
                card.className = 'card fade-in hover:shadow-md transition-all duration-200 border-l-4 ' + 
                    (team.suspicious ? 'border-yellow-500 bg-yellow-50' : 'border-blue-500');

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 truncate">${escapeHtml(team.team_name)}</h3>
                        ${team.finished ? '<span class="inline-flex px-2 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800">{{ T $.Lang "monitor.finish" }}</span>' : ''}
                        ${team.place ? `<span class="inline-flex px-2 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800">#${team.place}</span>` : ''}
                    </div>

                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-3">
                        <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" data-width="${progressPercent}"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-1 text-sm">
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.levels" }}</span> <span class="font-medium">${team.completed_levels}/${team.total_levels}</span></div>
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.current" }}</span> <span class="font-medium">${team.current_level ? '#' + team.current_level : '—'}</span></div>
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.time" }}</span> <span class="font-mono">${team.total_time || '—'}</span></div>
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.attempts" }}</span> <span class="font-medium">${team.attempts || 0}</span></div>
                    </div>

                    ${team.suspicious ? `
                        <div class="mt-3 text-xs text-yellow-800 bg-yellow-100 p-2 rounded-md flex items-center gap-1">
                            <span>⚠️</span> ${escapeHtml(team.suspicious_reason || '{{ T $.Lang "monitor.suspicious" }}')}
                        </div>
                    ` : ''}

                    ${!team.finished && !team.suspicious ? `
                        <div class="mt-3">
                            <button data-action="disqualify" data-team-id="${team.team_id}" class="btn btn-danger text-xs w-full">
                                {{ T $.Lang "monitor.disqualify" }}
                            </button>
                        </div>
                    ` : ''}
                `;
                teamsContainer.appendChild(card);
                // Set progress bar width via JS (CSP-safe)
                card.querySelectorAll('[data-width]').forEach(function(el) {
                    el.style.width = el.getAttribute('data-width') + '%';
                });
            });
        }

        // Обработка уведомления о старте игры
        function handleGameStartedNotification(data) {
            console.log('Monitor: game started —', data.team_name);
            
            // Update connection status
            updateConnectionStatus('✅ ' + data.team_name + ' {{ T $.Lang "monitor.game_started" }}', '#2ecc71');
            
            // Перезагружаем данные через 1 секунду чтобы увидеть обновление
            setTimeout(() => {
                if (wsConnected) {
                    // WebSocket активен — данные придут автоматически
                } else {
                    // Fallback на polling
                    fetchInitialData();
                }
            }, 1000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Дисквалификация команды с подтверждением (CSP-safe via event delegation)
        teamsContainer.addEventListener('click', function(e) {
            var btn = e.target.closest('[data-action="disqualify"]');
            if (!btn) return;
            var teamId = btn.getAttribute('data-team-id');
            if (!teamId) return;
            disqualifyTeam(teamId);
        });

        window.disqualifyTeam = function(teamId) {
            if (!confirm('{{ T $.Lang "monitor.disqualify_confirm" }}')) {
                return;
            }

            fetch(`/games/${gameID}/disqualify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `_csrf=${encodeURIComponent(csrfToken)}&team_id=${teamId}`
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.text();
            })
            .then(() => {
                console.log(`Team #${teamId} disqualified`);
            })
            .catch(err => {
                console.error('Дисквалификация:', err);
                alert('{{ T $.Lang "monitor.disqualify_error" }}' + err.message);
            });
        };

        // Запуск
        connect();

        // Очистка при уходе
        window.addEventListener('beforeunload', function() {
            if (wsClient) wsClient.close();
            stopPolling();
        });
    })();
</script>
{{end}}
