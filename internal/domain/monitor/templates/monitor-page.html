{{define "monitor-page.html"}}
<div class="max-w-7xl mx-auto" data-game-id="{{.GameID}}">
    <h1 class="page-title">{{ T $.Lang "monitor.page_title" }}</h1>

    <div class="card">
        <div id="teams-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- C1: skeleton-заглушка — видна до первого снапшота (данные приходят
                 по WebSocket/SSE, начальное состояние пустое) -->
            <div class="monitor-skeleton card" aria-hidden="true">
                <div class="skeleton h-6 w-2/3 mb-4"></div>
                <div class="skeleton h-2.5 w-full mb-3"></div>
                <div class="skeleton h-4 w-1/2 mb-2"></div>
                <div class="skeleton h-4 w-3/4"></div>
            </div>
            <div class="monitor-skeleton card" aria-hidden="true">
                <div class="skeleton h-6 w-1/2 mb-4"></div>
                <div class="skeleton h-2.5 w-full mb-3"></div>
                <div class="skeleton h-4 w-2/3 mb-2"></div>
                <div class="skeleton h-4 w-1/2"></div>
            </div>
            <div class="monitor-skeleton card" aria-hidden="true">
                <div class="skeleton h-6 w-3/4 mb-4"></div>
                <div class="skeleton h-2.5 w-full mb-3"></div>
                <div class="skeleton h-4 w-1/3 mb-2"></div>
                <div class="skeleton h-4 w-2/3"></div>
            </div>
        </div>
        <div id="connection-status" role="status" aria-live="polite" class="mt-4 text-sm text-gray-500 dark:text-gray-400"></div>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
    (function() {
        const container = document.querySelector('[data-game-id]');
        if (!container) return;

        const gameID = container.dataset.gameId;
        const csrfToken = '{{.csrf}}';
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${location.host}/games/${gameID}/monitor/ws`;
        let wsClient = null;
        let teamsData = [];
        const MAX_RECONNECT_ATTEMPTS = 5;
        const POLL_INTERVAL = 10000;

        const teamsContainer = document.getElementById('teams-container');
        const statusEl = document.getElementById('connection-status');
        let pollingTimer = null;
        let wsConnected = false;

        function updateConnectionStatus(text, color = '#888') {
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.style.color = color;
            }
        }

        function connect() {
            if (wsConnected) return;
            // UX-3 (pass 38): если клиент уже создан (в reconnecting/backoff) —
            // не пересоздаём его, иначе polling каждые 10с сбрасывал бы
            // exponential-backoff и maxAttempts из UX15. Новый клиент создаётся
            // только после onFinalClose (wsClient = null).
            if (wsClient) return;

            // Единый reconnecting-клиент (UX15). После исчерпания попыток
            // onFinalClose переключает монитор на polling и сбрасывает клиент.
            wsClient = window.createReconnectingWebSocket(wsUrl, {
                maxAttempts: MAX_RECONNECT_ATTEMPTS,
                onMessage: function(e) {
                    try {
                        const data = JSON.parse(e.data);
                        // Проверяем, является ли это уведомлением о старте игры
                        if (data && data.type === 'game_started') {
                            handleGameStartedNotification(data);
                            return;
                        }
                        // Иначе это snapshot данных мониторинга
                        teamsData = data;
                        renderTeams();
                    } catch (err) {
                        console.error('Monitor: parse error', err);
                    }
                },
                onStatus: function(name) {
                    if (name === 'connected') {
                        wsConnected = true;
                        updateConnectionStatus('{{ T $.Lang "monitor.connected" }}', '#2ecc71');
                        stopPolling();
                    } else if (name === 'reconnecting') {
                        wsConnected = false;
                        updateConnectionStatus('{{ T $.Lang "monitor.reconnecting" }}', '#e67e22');
                    } else if (name === 'error') {
                        updateConnectionStatus('{{ T $.Lang "monitor.error_connecting" }}', '#e74c3c');
                    } else if (name === 'failed') {
                        wsConnected = false;
                        updateConnectionStatus('{{ T $.Lang "monitor.switching_polling" }}', '#e67e22');
                        startPolling();
                    }
                },
                onFinalClose: function() {
                    wsConnected = false;
                    // Разрешаем создать нового клиента при следующем polling.
                    wsClient = null;
                }
            });
        }

        // Polling fallback
        function startPolling() {
            stopPolling();
            fetchInitialData();
            pollingTimer = setInterval(fetchInitialData, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
            }
        }

        function fetchInitialData() {
            fetch(`/games/${gameID}/monitor/data`, {
                headers: { 'X-CSRF-TOKEN': csrfToken }
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                teamsData = data.teams || data || [];
                renderTeams();
                updateConnectionStatus('{{ T $.Lang "monitor.polling" }}', '#3498db');
                // Try reconnecting WS in background
                if (!wsConnected) {
                    connect();
                }
            })
            .catch(err => {
                console.error('Monitor: polling error', err);
                updateConnectionStatus('{{ T $.Lang "monitor.fetch_error" }}', '#e74c3c');
            });
        }

        function formatTime(seconds) {
            if (seconds <= 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function renderTeams() {
            // U-5: дифф-обновление по team_id — карточка создаётся один раз,
            // при новых снапшотах пересобираем только её содержимое. Это не
            // сбрасывает фокус/скролл и не повторяет fade-in на каждый тик.
            // C1: при первом реальном снапшоте убираем skeleton-заглушку.
            const existing = {};
            teamsContainer.querySelectorAll('.monitor-team-card').forEach(c => { existing[c.dataset.teamId] = c; });
            const seen = new Set();

            if (!teamsData || teamsData.length === 0) {
                teamsContainer.innerHTML = `<div class="col-span-full text-center text-gray-500 dark:text-gray-400 py-8">{{ T $.Lang "monitor.no_data" }}</div>`;
                return;
            }
            teamsContainer.querySelectorAll('.monitor-skeleton').forEach(s => s.remove());

            teamsData.forEach(team => {
                const key = String(team.team_id);
                seen.add(key);
                let card = existing[key];
                if (!card) {
                    card = document.createElement('div');
                    card.className = 'monitor-team-card card hover:shadow-md transition-all duration-200 border-l-4';
                    card.dataset.teamId = key;
                    teamsContainer.appendChild(card);
                }

                const progressPercent = team.total_levels > 0 ? (team.completed_levels / team.total_levels * 100) : 0;
                card.className = 'monitor-team-card card hover:shadow-md transition-all duration-200 border-l-4 ' +
                    (team.suspicious ? 'border-yellow-500 bg-yellow-50 dark:bg-yellow-900/30' : 'border-blue-500');
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 truncate">${escapeHtml(team.team_name)}</h3>
                        ${team.finished ? '<span class="inline-flex px-2 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-200">{{ T $.Lang "monitor.finish" }}</span>' : ''}
                        ${team.place ? `<span class="inline-flex px-2 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-200">#${escapeHtml(team.place)}</span>` : ''}
                    </div>

                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-3">
                        <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" data-width="${progressPercent}"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-1 text-sm">
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.levels" }}</span> <span class="font-medium">${team.completed_levels}/${team.total_levels}</span></div>
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.current" }}</span> <span class="font-medium">${team.current_level ? '#' + escapeHtml(team.current_level) : '—'}</span></div>
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.time" }}</span> <span class="font-mono">${escapeHtml(team.total_time || '—')}</span></div>
                        <div><span class="text-gray-500 dark:text-gray-400">{{ T $.Lang "monitor.attempts" }}</span> <span class="font-medium">${team.attempts || 0}</span></div>
                    </div>

                    ${team.suspicious ? `
                        <div class="mt-3 text-xs text-yellow-800 dark:text-yellow-200 bg-yellow-100 dark:bg-yellow-900/40 p-2 rounded-md flex items-center gap-1">
                            <span aria-hidden="true">⚠️</span> ${escapeHtml(team.suspicious_reason || '{{ T $.Lang "monitor.suspicious" }}')}
                        </div>
                    ` : ''}

                    ${!team.finished && !team.suspicious ? `
                        <div class="mt-3">
                            <button data-action="disqualify" data-team-id="${escapeHtml(String(team.team_id))}" data-confirm-danger="true" data-confirm-ok='{{ T $.Lang "monitor.disqualify" }}' class="btn btn-danger text-xs w-full">
                                {{ T $.Lang "monitor.disqualify" }}
                            </button>
                        </div>
                    ` : ''}
                `;
                // Set progress bar width via JS (CSP-safe)
                card.querySelectorAll('[data-width]').forEach(function(el) {
                    el.style.width = el.getAttribute('data-width') + '%';
                });
            });

            // Удаляем карточки команд, которых больше нет в снапшоте.
            Object.keys(existing).forEach(id => {
                if (!seen.has(id)) existing[id].remove();
            });
        }

        // Обработка уведомления о старте игры
        function handleGameStartedNotification(data) {
            
            // Update connection status
            updateConnectionStatus('✅ ' + data.team_name + ' {{ T $.Lang "monitor.game_started" }}', '#2ecc71');
            
            // Перезагружаем данные через 1 секунду чтобы увидеть обновление
            setTimeout(() => {
                if (wsConnected) {
                    // WebSocket активен — данные придут автоматически
                } else {
                    // Fallback на polling
                    fetchInitialData();
                }
            }, 1000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Дисквалификация команды с подтверждением (CSP-safe via event delegation)
        teamsContainer.addEventListener('click', function(e) {
            var btn = e.target.closest('[data-action="disqualify"]');
            if (!btn) return;
            var teamId = btn.getAttribute('data-team-id');
            if (!teamId) return;
            disqualifyTeam(teamId);
        });

        window.disqualifyTeam = async function(teamId) {
            // Единая кастомная модалка (UX1) вместо нативного confirm.
            // S-5 (pass 33): элемент-кнопка передаётся для определения danger.
            let actionBtn = teamsContainer.querySelector('[data-action="disqualify"][data-team-id="' + teamId + '"]');
            // UX-6 (pass 37): если карточка перерисована снапшотом до клика —
            // кнопка может быть null; фолбэк-элемент сохраняет красную OK-кнопку.
            if (!actionBtn) {
                actionBtn = { dataset: { confirmDanger: 'true' } };
            }
            const ok = await window.showModalConfirm('{{ T $.Lang "monitor.disqualify_confirm" }}', actionBtn);
            if (!ok) return;

            // MED-7: блокируем кнопку на время запроса (защита от двойного POST).
            const btn = actionBtn;
            if (btn && typeof btn.disabled === 'boolean') {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            fetch(`/games/${gameID}/disqualify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `_csrf=${encodeURIComponent(csrfToken)}&team_id=${teamId}`
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.text();
            })
            .then(() => {
                window.showToast('{{ T $.Lang "monitor.disqualify_success" }}', 'success');
                // UX-7 (pass 31): убираем карточку команды сразу — не ждём
                // следующего WS-снапшота.
                teamsContainer.querySelectorAll('.monitor-team-card').forEach(function(card) {
                    if (card.dataset.teamId === String(teamId)) card.remove();
                });
            })
            .catch(err => {
                console.error('Дисквалификация:', err);
                window.showToast('{{ T $.Lang "monitor.disqualify_error" }}' + err.message, 'error');
                // UX-2 (pass 38): btn может быть fallback-объектом без classList.
                if (btn && btn.classList) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        };

        // Крит#1: WS после загрузки app.js (defer) — запускаем на DOMContentLoaded.
        document.addEventListener('DOMContentLoaded', function() { connect(); });

        // Очистка при уходе
        window.addEventListener('beforeunload', function() {
            if (wsClient) wsClient.close();
            stopPolling();
        });
    })();
</script>
{{end}}
