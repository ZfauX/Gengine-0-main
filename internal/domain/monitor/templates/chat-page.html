{{define "chat-page.html"}}
<div class="max-w-4xl mx-auto" data-game-id="{{.GameID}}" data-user-id="{{.UserID}}" data-user-name="{{.UserName}}" data-passing-id="{{.PassingID}}" data-csrf="{{.csrf}}">
    <h1 class="page-title">{{ T $.Lang "gamechat.title" }}</h1>

    <div class="card">
        <!-- Кнопки переключения комнат -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button id="btn-general" class="btn btn-primary text-sm" aria-pressed="true">{{ T $.Lang "gamechat.general" }}</button>
            {{if .PassingID}}
            <button id="btn-team" class="btn btn-outline text-sm" aria-pressed="false">{{ T $.Lang "gamechat.team" }}</button>
            {{end}}
            {{if .CanManage}}
            <!-- B-4 (pass 45): создание комнат автором/соавтором -->
            <button id="btn-create-room" type="button" class="btn btn-outline text-sm">{{ T $.Lang "gamechat.create_room" }}</button>
            {{end}}
            <!-- IDEA-6: онлайн-индикатор комнаты -->
            <span id="chat-presence" class="inline-flex items-center gap-1.5 text-xs px-2 py-1 rounded-full bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300" title="">
                <span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>
                <span id="chat-presence-count">1</span>
            </span>
        </div>

        <!-- B-4 (pass 45): форма создания комнаты -->
        <div id="create-room-form" class="hidden mb-4 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700">
            <div class="flex flex-wrap gap-2">
                <label for="new-room-name" class="sr-only">{{ T $.Lang "gamechat.room_name" }}</label>
                <input type="text" id="new-room-name" placeholder="{{ T $.Lang "gamechat.room_name" }}"
                       class="flex-1 min-w-[180px] rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder:text-gray-500 sm:text-sm px-3 py-2">
                <button id="room-create-submit" type="button" class="btn btn-primary text-sm">{{ T $.Lang "gamechat.room_create" }}</button>
            </div>
        </div>

        <!-- B-4 (pass 45): список дополнительных комнат -->
        <div id="extra-rooms" class="flex flex-wrap gap-2 mb-2"></div>

        <!-- Область сообщений -->
        <div class="relative">
            <div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions" class="h-96 overflow-y-auto border border-gray-200 dark:border-gray-700 rounded-lg p-4 bg-gray-50 dark:bg-gray-800 mb-3">
                <!-- IDEA-11: кнопка «загрузить ранее» — видна при прокрутке вверх -->
                <div class="text-center mb-2">
                    <button id="load-older-btn" type="button" class="hidden btn btn-outline text-xs"
                            aria-label="{{ T $.Lang "gamechat.load_older" }}">{{ T $.Lang "gamechat.load_older" }}</button>
                </div>
                <!-- C1: skeleton-заглушка до загрузки истории -->
                <div id="chat-skeleton" class="space-y-3" aria-hidden="true">
                    <div class="skeleton h-4 w-1/2"></div>
                    <div class="skeleton h-4 w-2/3"></div>
                    <div class="skeleton h-4 w-1/3"></div>
                    <div class="skeleton h-4 w-3/4"></div>
                    <div class="skeleton h-4 w-1/2"></div>
                </div>
            </div>
            <!-- UX-6 (pass 35): бейдж «новые сообщения» — появляется, когда
                 пришло сообщение, а пользователь читает выше. R1 (pass 36):
                 обработчик через addEventListener — inline onclick блокируется CSP. -->
            <button id="chat-unread-badge" type="button"
                    class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-10 btn btn-primary text-xs shadow-lg"
                    aria-label="{{ T $.Lang "gamechat.unread_messages" }}"></button>
        </div>

        <!-- Поле ввода и отправка -->
        <div class="flex flex-wrap items-center gap-2">
            <label for="chat-input" class="sr-only">{{ T $.Lang "gamechat.input_placeholder" }}</label>
            <input type="text" id="chat-input" placeholder="{{ T $.Lang "gamechat.input_placeholder" }}" 
                   class="flex-1 min-w-0 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
            <button id="send-btn" class="btn btn-primary text-sm whitespace-nowrap">{{ T $.Lang "gamechat.send_button" }}</button>
        </div>

        <!-- Статус подключения -->
        <div id="connection-status" role="status" class="mt-2 text-sm text-gray-500 dark:text-gray-400"></div>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
    (function() {
        const container = document.querySelector('[data-game-id]');
        if (!container) return;

        const gameID = parseInt(container.dataset.gameId, 10);
        const userID = parseInt(container.dataset.userId, 10);
        const userName = container.dataset.userName || '{{ T $.Lang "common.you" }}';
        const csrfToken = container.dataset.csrf || '';
        const passingID = container.dataset.passingId ? parseInt(container.dataset.passingId, 10) : null;

        let currentRoom = 'general';
        let activeRoomID = null;
        let generalRoomID = null;
        let teamRoomID = null;
        let extraRooms = [];
        let roomsLoaded = false;

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

        const btnGeneral = document.getElementById('btn-general');
        const btnTeam = document.getElementById('btn-team');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('connection-status');

        // Храним ID уже отображённых сообщений, чтобы избежать дублирования
        const renderedIds = new Set();

        function updateConnectionStatus(text, color = '#888') {
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.style.color = color;
            }
        }

        // Загружаем ID комнат + дополнительные комнаты (B-4)
        fetch('/games/' + gameID + '/chat-rooms')
            .then(r => r.json())
            .then(data => {
                generalRoomID = data.general_room_id;
                teamRoomID = data.team_room_id;
                roomsLoaded = true;
                activeRoomID = generalRoomID;
                if (btnGeneral) btnGeneral.className = 'btn btn-primary text-sm';
                connect();
            })
            .catch(err => {
                console.error('Chat: error loading rooms:', err);
                updateConnectionStatus('{{ T $.Lang "gamechat.load_error" }}', '#e74c3c');
            });

        // B-4 (pass 45): загружаем дополнительные комнаты игры и рисуем кнопки.
        const extraRoomsEl = document.getElementById('extra-rooms');
        const btnCreateRoom = document.getElementById('btn-create-room');
        const createRoomForm = document.getElementById('create-room-form');
        const newRoomName = document.getElementById('new-room-name');
        const roomCreateSubmit = document.getElementById('room-create-submit');

        function loadExtraRooms() {
            fetch('/games/' + gameID + '/chat/rooms')
                .then(r => { if (!r.ok) return null; return r.json(); })
                .then(data => {
                    if (!data) return;
                    extraRoomsEl.innerHTML = '';
                    const all = data.rooms || [];
                    // Все, кроме системной общей (game_id с room_type general создаётся системно).
                    extraRooms = all.filter(r => r.room_type !== 'game_general' || r.id !== generalRoomID);
                    extraRooms.forEach(function(room) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-outline text-sm';
                        btn.textContent = '#' + room.name + ' (' + room.id + ')';
                        btn.addEventListener('click', function() {
                            activeRoomID = room.id;
                            currentRoom = 'custom';
                            connect();
                            // Обновляем подсветку кнопок.
                            btnGeneral.className = 'btn btn-outline text-sm';
                            if (btnTeam) btnTeam.className = 'btn btn-outline text-sm';
                            btn.className = 'btn btn-primary text-sm';
                        });
                        extraRoomsEl.appendChild(btn);
                    });
                })
                .catch(err => console.error('Chat: error loading extra rooms:', err));
        }
        loadExtraRooms();

        if (btnCreateRoom) {
            btnCreateRoom.addEventListener('click', function() {
                createRoomForm.classList.toggle('hidden');
                if (!createRoomForm.classList.contains('hidden')) newRoomName.focus();
            });
        }
        if (roomCreateSubmit) {
            roomCreateSubmit.addEventListener('click', function() {
                const name = newRoomName.value.trim();
                if (!name) return;
                const formData = new FormData();
                formData.append('name', name);
                fetch('/games/' + gameID + '/chat/rooms', {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-CSRF-Token': csrfToken }
                })
                .then(r => {
                    if (!r.ok) throw new Error('create room failed');
                    newRoomName.value = '';
                    createRoomForm.classList.add('hidden');
                    loadExtraRooms();
                })
                .catch(err => console.error('Chat: create room error:', err));
            });
        }

        function connect() {
            if (!roomsLoaded) return;
            const room = activeRoomID;
            if (!room) {
                updateConnectionStatus('{{ T $.Lang "gamechat.room_error" }}', '#e74c3c');
                return;
            }

            if (chat) chat.close();

            // Единый reconnecting-клиент (UX15) — reconnect/status в одном месте.
            chat = window.createReconnectingWebSocket(
                `${wsProtocol}//${location.host}/chat/ws?room=${room}`,
                {
                    onMessage: function(e) {
                        try {
                            const data = JSON.parse(e.data);
                            if (data.type === 'history') {
                                // L-8 (pass 40): отключаем aria-live на время
                                // вставки 50+ сообщений — скринридер не должен
                                // объявлять весь бэклог сразу.
                                chatMessages.setAttribute('aria-live', 'off');
                                chatMessages.innerHTML = '';
                                renderedIds.clear();
                                if (Array.isArray(data.messages)) {
                                    data.messages.forEach(msg => {
                                        const id = msg.id || msg.ID || '';
                                        if (id) renderedIds.add(id);
                                        renderMessage(msg);
                                    });
                                }
                                // Возвращаем aria-live после загрузки истории.
                                chatMessages.setAttribute('aria-live', 'polite');
                                // UX-M4 (pass 34): после загрузки истории прокручиваем вниз.
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                                updateLoadOlderButton();
                            } else if (data.type === 'history_older') {
                                // IDEA-11: ленивая подгрузка старой истории —
                                // вставляем ПЕРЕД текущими сообщениями, сохраняя скролл.
                                const list = Array.isArray(data.messages) ? data.messages : [];
                                if (!list.length) { hideLoadOlderButton(); return; }
                                chatMessages.setAttribute('aria-live', 'off');
                                const prevHeight = chatMessages.scrollHeight;
                                // Вставляем каждое сообщение в начало (в обратном порядке, чтобы
                                // порядок был правильным: messages приходит от старых к новым).
                                list.slice().reverse().forEach(msg => {
                                    const id = msg.id || msg.ID || '';
                                    if (id) renderedIds.add(id);
                                    const div = buildMessageEl(msg);
                                    chatMessages.insertBefore(div, chatMessages.firstChild);
                                });
                                chatMessages.setAttribute('aria-live', 'polite');
                                // Сохраняем видимую позицию: корректируем scrollTop на добавленную высоту.
                                chatMessages.scrollTop = chatMessages.scrollHeight - prevHeight;
                                updateLoadOlderButton();
                            } else if (data.type === 'message') {
                                const msg = data.message;
                                const msgId = msg.id || msg.ID || '';
                                if (!msgId || renderedIds.has(msgId)) return; // пропускаем дубли
                                // C2: серверное echo уже показанного optimistic-сообщения — не дублируем.
                                const author = (msg.User && msg.User.Name) || msg.user_name || (msg.user && msg.user.name) || '';
                                const content = msg.Content || msg.content || msg.text || '';
                                const now = Date.now();
                                for (let i = recentSends.length - 1; i >= 0; i--) {
                                    const rs = recentSends[i];
                                    if (now - rs.ts > 3000) { recentSends.splice(0, i + 1); break; }
                                    if (rs.author === author && rs.content === content) {
                                        recentSends.splice(i, 1);
                                        renderedIds.add(msgId);
                                        return;
                                    }
                                }
                                renderedIds.add(msgId);
                                renderMessage(msg);
                            } else if (data.type === 'presence') {
                                // IDEA-6: онлайн-индикатор — сколько человек в комнате.
                                const presenceCount = typeof data.count === 'number' ? data.count : 1;
                                const presenceEl = document.getElementById('chat-presence-count');
                                if (presenceEl) {
                                    presenceEl.textContent = String(presenceCount);
                                }
                                const presenceBadge = document.getElementById('chat-presence');
                                if (presenceBadge) {
                                    const isSelf = data.user_ids && Array.isArray(data.user_ids) &&
                                        data.user_ids.indexOf(userID) !== -1;
                                    const onlineLabel = '{{ T $.Lang "gamechat.online_count" }}';
                                    presenceBadge.title = onlineLabel.replace('%d', String(presenceCount)) +
                                        (isSelf ? '' : '');
                                }
                            }
                        } catch (err) {
                            console.error('Chat: message processing error', err);
                        }
                    },
                    onStatus: function(name) {
                        if (name === 'connected') {
                            updateConnectionStatus('{{ T $.Lang "gamechat.connected" }}', '#2ecc71');
                        } else if (name === 'reconnecting') {
                            updateConnectionStatus('{{ T $.Lang "gamechat.reconnecting" }}', '#e67e22');
                        } else if (name === 'error' || name === 'failed') {
                            updateConnectionStatus('{{ T $.Lang "gamechat.connection_error" }}', '#e74c3c');
                        } else if (name === 'connecting') {
                            updateConnectionStatus('{{ T $.Lang "gamechat.connecting" }}', '#888');
                        }
                    },
                    // UX-13 (pass 45): попытки исчерпаны — сообщаем и пробуем
                    // полную перезагрузку через 30с (единственный способ пересоздать WS).
                    onFinalClose: function() {
                        updateConnectionStatus('{{ T $.Lang "gamechat.connection_error" }}', '#e74c3c');
                        if (typeof window.showToast === 'function') {
                            window.showToast('{{ T $.Lang "chat.final_close" }}', 'error', 6000);
                        }
                        setTimeout(function() { window.location.reload(); }, 30000);
                    }
                }
            );
        }

        // IDEA-11: кнопка «загрузить ранее» + ленивая подгрузка истории.
        const loadOlderBtn = document.getElementById('load-older-btn');
        let oldestVisibleID = null;

        function buildMessageEl(msg) {
            const div = document.createElement('div');
            div.className = 'chat-message py-1';
            const time = msg.created_at || msg.CreatedAt ? new Date(msg.created_at || msg.CreatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            const author = (msg.User && msg.User.Name) || msg.user_name || (msg.user && msg.user.name) || '{{ T $.Lang "gamechat.unknown_user" }}';
            div.innerHTML = `<span class="font-semibold text-gray-800 dark:text-gray-100">${escapeHtml(author)}:</span> ${escapeHtml(msg.Content || msg.content || msg.text)} <span class="text-xs text-gray-500">(${time})</span>`;
            div.dataset.msgId = msg.id || msg.ID || '';
            return div;
        }

        function renderMessage(msg) {
            const div = buildMessageEl(msg);
            chatMessages.appendChild(div);
            // U-6: авто-скролл только если пользователь уже у низа — иначе
            // новые сообщения не дёргают читающего выше.
            const nearBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 80;
            if (nearBottom) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                hideUnreadBadge();
            } else {
                // UX-6 (pass 35): пришло сообщение, читающий выше — показываем
                // счётчик непрочитанных вместо принудительного скролла.
                bumpUnreadBadge();
            }
        }

        function oldestMsgID() {
            const msgs = chatMessages.querySelectorAll('.chat-message');
            for (let i = 0; i < msgs.length; i++) {
                const id = msgs[i].dataset.msgId;
                if (id && id.indexOf('local-') !== 0) return id;
            }
            return null;
        }

        function updateLoadOlderButton() {
            if (!loadOlderBtn) return;
            oldestVisibleID = oldestMsgID();
            loadOlderBtn.classList.toggle('hidden', !oldestVisibleID);
        }

        function hideLoadOlderButton() {
            if (loadOlderBtn) loadOlderBtn.classList.add('hidden');
        }

        if (loadOlderBtn) {
            loadOlderBtn.addEventListener('click', function() {
                const bid = oldestMsgID();
                if (!bid || !chat || !chat.isOpen()) return;
                // Блокируем повторные клики до ответа сервера.
                loadOlderBtn.disabled = true;
                chat.send(JSON.stringify({ type: 'load_older', before_id: parseInt(bid, 10) || 0 }));
                setTimeout(function() { loadOlderBtn.disabled = false; }, 500);
            });
        }

        // Показываем кнопку «загрузить ранее» при прокрутке к верху.
        if (chatMessages) {
            chatMessages.addEventListener('scroll', function() {
                if (chatMessages.scrollTop < 60) updateLoadOlderButton();
            });
        }

        // UX-6 (pass 35): счётчик непрочитанных сообщений в чате.
        let unreadCount = 0;
        const chatUnreadBadge = document.getElementById('chat-unread-badge');
        const badgeLabel = '{{ T $.Lang "gamechat.unread_messages" }}';

        function bumpUnreadBadge() {
            if (!chatUnreadBadge) return;
            unreadCount++;
            chatUnreadBadge.textContent = badgeLabel.replace('%d', String(unreadCount));
            chatUnreadBadge.classList.remove('hidden');
        }

        function hideUnreadBadge() {
            if (!chatUnreadBadge) return;
            unreadCount = 0;
            chatUnreadBadge.classList.add('hidden');
        }

        // R1/R2 (pass 36): клик по бейджу — скролл вниз + сброс счётчика.
        // Раньше был inline onclick, который CSP (script-src без unsafe-inline)
        // блокировал — бейдж был мёртв, счётчик не сбрасывался.
        if (chatUnreadBadge) {
            chatUnreadBadge.addEventListener('click', function() {
                chatMessages.scrollTo({top: chatMessages.scrollHeight, behavior: 'smooth'});
                hideUnreadBadge();
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Переключение комнат
        btnGeneral.addEventListener('click', function() {
            if (currentRoom === 'general') return;
            currentRoom = 'general';
            activeRoomID = generalRoomID;
            btnGeneral.className = 'btn btn-primary text-sm';
            btnGeneral.setAttribute('aria-pressed', 'true');
            if (btnTeam) { btnTeam.className = 'btn btn-outline text-sm'; btnTeam.setAttribute('aria-pressed', 'false'); }
            resetExtraButtons();
            connect();
        });

        if (btnTeam) {
            btnTeam.addEventListener('click', function() {
                if (currentRoom === 'team') return;
                currentRoom = 'team';
                activeRoomID = teamRoomID;
                btnTeam.className = 'btn btn-primary text-sm';
                btnTeam.setAttribute('aria-pressed', 'true');
                btnGeneral.className = 'btn btn-outline text-sm';
                btnGeneral.setAttribute('aria-pressed', 'false');
                resetExtraButtons();
                connect();
            });
        }

        function resetExtraButtons() {
            const btns = extraRoomsEl.querySelectorAll('button');
            btns.forEach(b => b.className = 'btn btn-outline text-sm');
        }

        // Отправка сообщения с оптимистичным отображением (C2):
        // пузырь появляется мгновенно, реальное сообщение с сервера
        // дедуплицируется по renderedIds (сервер вернёт его с id).
        // recentSends хранит недавние локальные отправки — если серверное
        // сообщение совпадает по автору+тексту, не рисуем второй пузырь.
        const recentSends = [];

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            if (!chat || !chat.isOpen()) {
                updateConnectionStatus('{{ T $.Lang "gamechat.connection_error" }}', '#e74c3c');
                return;
            }
            const room = activeRoomID;
            chat.send(JSON.stringify({
                type: 'message',
                room_id: room || 0,
                content: text
            }));
            // Оптимистичный пузырь — собственное сообщение видно сразу.
            const optimisticId = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
            renderMessage({
                id: optimisticId,
                user_name: userName,
                content: text,
                created_at: new Date().toISOString()
            });
            recentSends.push({ author: userName, content: text, ts: Date.now() });
            if (recentSends.length > 20) recentSends.shift();
            chatInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        window.addEventListener('beforeunload', function() {
            if (chat) chat.close();
        });
    })();
</script>
{{end}}
