{{define "ratings-leaderboard.html"}}
<div class="max-w-4xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "rating.title" }}</h1>

    <div class="card overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 dark:bg-gray-800">
                <tr>
                    <th scope="col" class="table-header">{{ T $.Lang "rating.table_place" }}</th>
                    <th scope="col" class="table-header">{{ T $.Lang "rating.table_player" }}</th>
                    <th scope="col" class="table-header">{{ T $.Lang "rating.table_score" }}</th>
                </tr>
            </thead>
            <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200">
                {{range .Entries}}
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-100 font-medium">{{.Place}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 dark:text-gray-300">
                        <a href="/users/{{.User.ID}}" class="text-blue-600 dark:text-blue-400 hover:underline">{{.User.Name}}</a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-gray-100">{{.Score}}</td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500 dark:text-gray-400">{{ T $.Lang "rating.empty" }}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
