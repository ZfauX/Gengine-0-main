{{define "reviews-new.html"}}
<div class="max-w-3xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "review.new_title" }}</h1>

    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <form action="/games/{{.GameID}}/review" method="POST" class="card space-y-4">
        <input type="hidden" name="_csrf" value="{{.csrf}}">

        <!-- Оценка -->
        <div>
            <label for="rating" class="form-label">{{ T $.Lang "review.rating_label" }}</label>
            <select name="rating" id="rating" required
                    class="w-full rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm {{if .Errors.rating}}border-red-500{{else}}border-gray-300 dark:border-gray-600{{end}}">
                <option value="">--</option>
                <option value="1">{{ T $.Lang "review.rating_1" }}</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">{{ T $.Lang "review.rating_5" }}</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">{{ T $.Lang "review.rating_10" }}</option>
            </select>
            {{if .Errors.rating}}<p class="field-error">{{.Errors.rating}}</p>{{end}}
        </div>

        <!-- Комментарий -->
        <div>
            <label for="comment" class="form-label">{{ T $.Lang "review.comment_label" }}</label>
            <textarea name="comment" id="comment" rows="4" placeholder="{{ T $.Lang "review.comment_placeholder" }}"
                      class="w-full rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm {{if .Errors.comment}}border-red-500{{else}}border-gray-300 dark:border-gray-600{{end}}"></textarea>
            {{if .Errors.comment}}<p class="field-error">{{.Errors.comment}}</p>{{end}}
        </div>

        <!-- Кнопки -->
        <div class="flex flex-wrap gap-3 pt-2">
            <button type="submit" class="btn btn-primary text-sm">{{ T $.Lang "review.submit_button" }}</button>
            <a href="/games/{{.GameID}}" class="btn btn-outline text-sm">{{ T $.Lang "review.cancel" }}</a>
        </div>
    </form>
</div>
{{end}}
