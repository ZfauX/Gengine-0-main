{{define "follow-list.html"}}
<div class="max-w-4xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "follow.title" }}</h1>

    {{if .Authors}}
    <div class="space-y-3">
        {{range .Authors}}
        <div class="card flex flex-wrap items-center justify-between gap-3 p-4 hover:shadow-md transition">
            <div>
                <span class="font-medium text-gray-800 dark:text-gray-100">{{.Name}}</span>
                {{if .Email}}<span class="text-sm text-gray-500 dark:text-gray-400 ml-2">{{.Email}}</span>{{end}}
            </div>
            <button class="btn btn-danger text-sm unfollow-btn" data-author-id="{{.ID}}" data-author-name="{{.Name}}">{{ T $.Lang "follow.unfollow" }}</button>
        </div>
        {{end}}
    </div>
    {{else}}
    <div class="card text-center py-12">
        <p class="text-gray-500 dark:text-gray-400">{{ T $.Lang "follow.no_follows" }}</p>
        <p class="mt-2 text-sm text-gray-400">{{ T $.Lang "follow.hint" }}</p>
    </div>
    {{end}}

    <div class="mt-6">
        <a href="/dashboard" class="btn btn-outline text-sm">{{ T $.Lang "follow.back_to_dashboard" }}</a>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
    (function() {
        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.getAttribute('content') : '';
        }
        var confirmMsg = '{{ T $.Lang "follow.unfollow_confirm" }}';
        var errorMsg = '{{ T $.Lang "follow.unfollow_error" }}';

        document.addEventListener('click', async function(e) {
            const btn = e.target.closest('.unfollow-btn');
            if (!btn) return;
            const authorID = btn.dataset.authorId;
            const authorName = btn.dataset.authorName;
            if (!authorID) return;
            var confirmed = await showModalConfirm(confirmMsg.replace('%s', authorName), btn);
            if (!confirmed) return;
            fetch('/follow/' + authorID, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': getCsrfToken()
                }
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'unfollowed') {
                    location.reload();
                } else {
                    showToast(errorMsg, 'error', 4000);
                }
            })
            .catch(err => {
                console.error(err);
                showToast(errorMsg, 'error', 4000);
            });
        });
    })();
</script>
{{end}}
