{{define "gameplay-test-finished.html"}}
<div class="max-w-3xl mx-auto text-center py-12">
    <div class="card">
        <div class="text-6xl mb-4">🎉</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ T $.Lang "gameplay.test_finished_title" }}</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">{{ T $.Lang "gameplay.test_finished_message" }}</p>
        <div class="flex justify-center gap-3">
            <a href="/games/{{.GameID}}" class="btn btn-primary text-sm">{{ T $.Lang "gameplay.test_back_to_game" }}</a>
            <a href="/games/{{.GameID}}/test" class="btn btn-outline text-sm">{{ T $.Lang "gameplay.test_restart" }}</a>
        </div>
    </div>
</div>
{{end}}
