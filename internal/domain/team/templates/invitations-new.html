{{define "invitations-new.html"}}
<div class="max-w-3xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "invitation.new_title" }}</h1>

    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <form action="/teams/{{.TeamID}}/invitations/new" method="POST" class="card space-y-4">
        <input type="hidden" name="_csrf" value="{{.csrf}}">
        <input type="hidden" name="user_id" id="selected_user_id">

        <!-- Поиск пользователей -->
        <div>
            <label for="user_search" class="form-label">{{ T $.Lang "invitation.search_user" }}</label>
            <input type="text" id="user_search" placeholder='{{ T $.Lang "invitation.search_placeholder" }}' autocomplete="off" required
                   class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
            <div id="search-results" class="mt-1 border border-gray-200 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 shadow-lg max-h-48 overflow-y-auto hidden"></div>
        </div>

        <!-- Выбранный пользователь -->
        <div id="selected-user-info" class="hidden p-3 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700 rounded-md">
            <p class="text-sm text-blue-800 dark:text-blue-200">
                {{ T $.Lang "invitation.invite_label" }} <span id="selected-user-name" class="font-semibold"></span>
                (<span id="selected-user-email"></span>)
            </p>
        </div>

        <!-- Кнопки -->
        <div class="flex flex-wrap gap-3 pt-2">
            <button type="submit" id="invite-btn" class="btn btn-primary text-sm" disabled>{{ T $.Lang "invitation.invite_button" }}</button>
            <a href="/teams/{{.TeamID}}" class="btn btn-outline text-sm">{{ T $.Lang "invitation.cancel" }}</a>
        </div>
    </form>
</div>

<script nonce="{{.csp_nonce}}">
(function() {
    const searchInput = document.getElementById('user_search');
    const resultsEl = document.getElementById('search-results');
    const selectedId = document.getElementById('selected_user_id');
    const selectedInfo = document.getElementById('selected-user-info');
    const selectedName = document.getElementById('selected-user-name');
    const selectedEmail = document.getElementById('selected-user-email');
    const inviteBtn = document.getElementById('invite-btn');
    const teamID = {{.TeamID}};
    let searchTimeout = null;
    let selected = null;

    searchInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (val.length < 2) {
            resultsEl.classList.add('hidden');
            return;
        }
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() { searchUsers(val); }, 300);
    });

    function searchUsers(query) {
        fetch('/api/teams/' + teamID + '/users/search?q=' + encodeURIComponent(query))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                resultsEl.innerHTML = '';
                if (!data.users || data.users.length === 0) {
                    resultsEl.innerHTML = '<div class="p-3 text-sm text-gray-500">{{ T $.Lang "invitation.no_results" }}</div>';
                    resultsEl.classList.remove('hidden');
                    return;
                }
                data.users.forEach(function(u) {
                    var div = document.createElement('div');
                    div.className = 'p-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer';
                    div.innerHTML = '<div class="font-medium text-gray-800 dark:text-gray-100">' + escapeHtml(u.name) + '</div>' +
                        '<div class="text-sm text-gray-500 dark:text-gray-400">' + escapeHtml(u.email) + ' (ID: ' + u.id + ')</div>';
                    div.addEventListener('click', function() { selectUser(u); });
                    resultsEl.appendChild(div);
                });
                resultsEl.classList.remove('hidden');
            })
            .catch(function() {
                resultsEl.innerHTML = '<div class="p-3 text-sm text-red-500">{{ T $.Lang "invitation.search_error" }}</div>';
                resultsEl.classList.remove('hidden');
            });
    }

    function selectUser(u) {
        selected = u;
        selectedId.value = u.id;
        selectedName.textContent = u.name;
        selectedEmail.textContent = u.email;
        selectedInfo.classList.remove('hidden');
        inviteBtn.disabled = false;
        resultsEl.classList.add('hidden');
        searchInput.value = u.name;
    }

    function escapeHtml(text) {
        var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
        return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // Click outside closes results
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#user_search') && !e.target.closest('#search-results')) {
            resultsEl.classList.add('hidden');
        }
    });
})();
</script>
{{end}}
