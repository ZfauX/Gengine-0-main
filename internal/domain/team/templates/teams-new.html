{{define "teams-new.html"}}
<div class="max-w-3xl mx-auto">
    <h1 class="page-title">Новая команда</h1>

    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <form action="/teams/new" method="POST" class="card space-y-4">
        <input type="hidden" name="_csrf" value="{{.csrf}}">

        <!-- Название команды -->
        <div>
            <label for="name" class="form-label">Название команды</label>
            <input type="text" name="name" id="name" placeholder="Название команды" required
                   class="w-full rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm {{if .Errors.name}}border-red-500{{else}}border-gray-300 dark:border-gray-600{{end}}">
            {{if .Errors.name}}<p class="field-error">{{.Errors.name}}</p>{{end}}
        </div>

        <!-- Кнопки -->
        <div class="flex flex-wrap gap-3 pt-2">
            <button type="submit" class="btn btn-primary text-sm">Создать</button>
            <a href="/teams" class="btn btn-outline text-sm">Отмена</a>
        </div>
    </form>
</div>
{{end}}
