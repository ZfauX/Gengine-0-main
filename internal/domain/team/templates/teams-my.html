{{define "teams-my.html"}}
<div class="max-w-4xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "teams.my_title" }}</h1>

    <div class="mb-6">
        <a href="/teams/new" class="btn btn-primary text-sm">{{ T $.Lang "teams.create_button" }}</a>
    </div>

    {{if .Teams}}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {{range .Teams}}
        <a href="/teams/{{.ID}}" class="card hover:shadow-md transition p-4 flex items-center justify-between">
            <span class="font-medium text-gray-800 dark:text-gray-100">{{.Name}}</span>
            <span class="text-sm text-gray-500">→</span>
        </a>
        {{end}}
    </div>
    {{else}}
    <div class="card text-center py-12">
        <p class="text-gray-500 dark:text-gray-400">{{ T $.Lang "teams.no_teams" }}</p>
        <p class="mt-2 text-sm text-gray-500"><a href="/teams/new" class="text-blue-600 dark:text-blue-400 hover:underline">{{ T $.Lang "teams.create_first" }}</a></p>
    </div>
    {{end}}
</div>
{{end}}
