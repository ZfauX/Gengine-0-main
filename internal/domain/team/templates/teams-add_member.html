{{define "teams-add_member.html"}}
<div class="max-w-3xl mx-auto">
    <h1 class="page-title">{{ T $.Lang "team.add_member_title" }}</h1>

    {{if .Error}}
    <div class="flash flash-error">{{.Error}}</div>
    {{end}}

    <form action="/teams/{{.TeamID}}/add-member" method="POST" class="card space-y-4">
        <input type="hidden" name="_csrf" value="{{.csrf}}">

        <!-- Выбор пользователя -->
        <div>
            <label for="user_id" class="form-label">{{ T $.Lang "team.select_user" }}</label>
            <select name="user_id" id="user_id" required
                    class="w-full rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm {{if .Errors.user_id}}border-red-500{{else}}border-gray-300 dark:border-gray-600{{end}}">
                <option value="">{{ T $.Lang "team.no_user" }}</option>
                {{range .Users}}
                    <option value="{{.ID}}">{{.Name}} ({{.Email}})</option>
                {{end}}
            </select>
            {{if .Errors.user_id}}<p class="field-error">{{.Errors.user_id}}</p>{{end}}
        </div>

        <!-- Кнопки -->
        <div class="flex flex-wrap gap-3 pt-2">
            <button type="submit" class="btn btn-primary text-sm">{{ T $.Lang "team.add_button" }}</button>
            <a href="/teams/{{.TeamID}}" class="btn btn-outline text-sm">{{ T $.Lang "team.cancel" }}</a>
        </div>
    </form>
</div>
{{end}}
