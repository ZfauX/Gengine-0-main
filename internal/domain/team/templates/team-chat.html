{{define "team-chat.html"}}
<div class="max-w-4xl mx-auto" data-room-id="{{.RoomID}}" data-user-id="{{.UserID}}" data-user-name="{{.UserName}}">
    <h1 class="page-title">{{ TF $.Lang "team.chat_title_name" .Team.Name }}</h1>

    <div class="card">
        <!-- Область сообщений -->
        <div class="relative">
            <div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions" class="h-96 overflow-y-auto border border-gray-200 dark:border-gray-700 rounded-lg p-4 bg-gray-50 dark:bg-gray-800 mb-3"></div>
            <!-- UX-6 (pass 35): бейдж «новые сообщения» — читающий выше видит счётчик.
                 R1 (pass 36): обработчик через addEventListener — inline onclick блокируется CSP. -->
            <button id="chat-unread-badge" type="button"
                    class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-10 btn btn-primary text-xs shadow-lg"
                    aria-label="{{ T $.Lang "team.unread_messages" }}"></button>
        </div>

        <!-- Поле ввода и отправка -->
        <div class="flex flex-wrap items-center gap-2">
            <label for="chat-input" class="sr-only">{{ T $.Lang "chat.input_placeholder" }}</label>
            <input type="text" id="chat-input" placeholder='{{ T $.Lang "chat.input_placeholder" }}' 
                   class="flex-1 min-w-0 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
            <button id="send-btn" class="btn btn-primary text-sm whitespace-nowrap">{{ T $.Lang "chat.send_button" }}</button>
        </div>

        <!-- Статус подключения -->
        <div id="connection-status" role="status" class="mt-2 text-sm text-gray-500 dark:text-gray-400"></div>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
(function() {
    const container = document.querySelector('[data-room-id]');
    if (!container) return;

    const roomID = parseInt(container.dataset.roomId, 10);
    const userID = parseInt(container.dataset.userId, 10);
    const userName = container.dataset.userName || '{{ T $.Lang "team.yourself" }}';
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('connection-status');

    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let chatClient = null;

    function connect() {
        if (chatClient && (chatClient.isOpen())) {
            return;
        }
        const wsUrl = wsProtocol + '//' + window.location.host + '/chat/ws?room=' + roomID;

        // Единый reconnecting-клиент (UX15)
        chatClient = window.createReconnectingWebSocket(wsUrl, {
            onMessage: function(event) {
                // M4: битый фрейм не должен убивать конвейер сообщений.
                var data;
                try { data = JSON.parse(event.data); } catch (err) { console.error('chat: invalid frame', err); return; }
                if (data.type === 'history' && data.messages) {
                    // L-8 (pass 40): отключаем aria-live на время вставки истории.
                    messagesEl.setAttribute('aria-live', 'off');
                    messagesEl.innerHTML = '';
                    data.messages.forEach(function(msg) { appendMessage(msg, false); });
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    messagesEl.setAttribute('aria-live', 'polite');
                } else if (data.type === 'message') {
                    removeSendingStatus();
                    appendMessage(data.message || data, true);
                }
            },
            onStatus: function(name) {
                if (name === 'connected') {
                    statusEl.textContent = '{{ T $.Lang "chat.connected" }}';
                    statusEl.className = 'mt-2 text-sm text-green-700 dark:text-green-400';
                } else if (name === 'reconnecting') {
                    statusEl.textContent = '{{ T $.Lang "chat.disconnected" }}';
                    statusEl.className = 'mt-2 text-sm text-red-500';
                } else if (name === 'error' || name === 'failed') {
                    statusEl.textContent = '{{ T $.Lang "chat.connection_error" }}';
                    statusEl.className = 'mt-2 text-sm text-red-500';
                }
            }
        });
    }

    function appendMessage(msg, scroll) {
        var userId = msg.UserID || msg.user_id;
        var userName = msg.UserName || (msg.User && msg.User.Name) || msg.user_name || '';
        var content = msg.Content || msg.content || '';
        var isMine = userId === userID;
        // UX-L2 (pass 34): время сообщения (24-часовой формат, как monitor-чат).
        var time = '';
        var ts = msg.CreatedAt || msg.created_at;
        if (ts) {
            try { time = new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { time = ''; }
        }
        var div = document.createElement('div');
        div.className = 'mb-3 ' + (isMine ? 'text-right' : 'text-left');
        div.innerHTML = '<div class="inline-block max-w-[80%] text-left">' +
            '<span class="text-xs font-medium text-gray-500 dark:text-gray-400">' + escapeHtml(userName) + (time ? ' <span class="text-gray-400">(' + escapeHtml(time) + ')</span>' : '') + '</span>' +
            '<div class="rounded-lg px-3 py-2 mt-1 ' + (isMine ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100') + '">' +
            escapeHtml(content) +
            '</div></div>';
        messagesEl.appendChild(div);
        // U-6: авто-скролл только у низа — не дёргаем читающего выше.
        const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
        if (nearBottom) {
            messagesEl.scrollTop = messagesEl.scrollHeight;
            hideUnreadBadge();
        } else {
            // UX-6 (pass 35): счётчик непрочитанных.
            bumpUnreadBadge();
        }
    }

    // UX-6 (pass 35): бейдж непрочитанных в командном чате.
    var unreadCount = 0;
    var chatUnreadBadge = document.getElementById('chat-unread-badge');
    var badgeLabel = '{{ T $.Lang "team.unread_messages" }}';

    function bumpUnreadBadge() {
        if (!chatUnreadBadge) return;
        unreadCount++;
        chatUnreadBadge.textContent = badgeLabel.replace('%d', String(unreadCount));
        chatUnreadBadge.classList.remove('hidden');
    }

    function hideUnreadBadge() {
        if (!chatUnreadBadge) return;
        unreadCount = 0;
        chatUnreadBadge.classList.add('hidden');
    }

    // R1/R2 (pass 36): клик по бейджу — скролл вниз + сброс счётчика.
    if (chatUnreadBadge) {
        chatUnreadBadge.addEventListener('click', function() {
            messagesEl.scrollTo({top: messagesEl.scrollHeight, behavior: 'smooth'});
            hideUnreadBadge();
        });
    }

    function escapeHtml(text) {
        var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
        return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function showSendingStatus(text) {
        var div = document.createElement('div');
        div.id = 'sending-status';
        div.className = 'mb-3 text-right';
        div.innerHTML = '<div class="inline-block max-w-[80%] text-left">' +
            '<div class="rounded-lg px-3 py-2 mt-1 bg-blue-400 text-white opacity-70">' +
            escapeHtml(text) +
            ' <span class="text-xs opacity-60">⏳</span></div></div>';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeSendingStatus() {
        var el = document.getElementById('sending-status');
        if (el) el.remove();
    }

    function sendMessage() {
        var text = inputEl.value.trim();
        if (!text) { return; }
        if (!chatClient || !chatClient.isOpen()) {
            statusEl.textContent = '{{ T $.Lang "chat.connection_error" }}';
            statusEl.className = 'mt-2 text-sm text-red-500';
            return;
        }
        showSendingStatus(text);
        chatClient.send(JSON.stringify({
            type: 'message',
            room_id: roomID,
            content: text
        }));
        inputEl.value = '';
        // UX-M5 (pass 34): НЕ убираем «sending…» вслепую через timeout —
        // пузырь исчезает только при серверном echo (onMessage). Иначе
        // пользователь не узнает об отказе доставки.
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // Крит#1: WS после загрузки app.js (defer).
    document.addEventListener('DOMContentLoaded', connect);
})();
</script>
{{end}}
