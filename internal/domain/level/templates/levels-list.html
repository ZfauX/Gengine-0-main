{{define "levels-list.html"}}
<div class="max-w-7xl mx-auto">
    <h1 class="page-title" id="page-title">Уровни игры</h1>

    {{if .Error}}
    <div class="flash flash-error" role="alert">{{.Error}}</div>
    {{end}}

    <div class="mb-6">
        <a href="/games/{{.GameID}}/levels/new" class="btn btn-primary text-sm" aria-label="Создать новый уровень">+ Добавить уровень</a>
    </div>

    {{if .Levels}}
    <div id="level-list" class="space-y-3" role="list" aria-label="Список уровней" data-game-id="{{.GameID}}">
        {{range .Levels}}
         <div class="card flex flex-wrap items-center gap-3 p-4 hover:shadow-md transition" role="listitem" draggable="true"
              data-level-id="{{.ID}}" data-position="{{.Position}}"
             aria-label="Уровень {{.Name}}, позиция {{.Position}}">
            <div class="cursor-grab active:cursor-grabbing touch-none" aria-label="Перетащить для сортировки">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
            </div>
            <div class="flex-1 min-w-[180px]">
                <a href="/games/{{$.GameID}}/levels/{{.ID}}" class="text-blue-600 dark:text-blue-400 hover:underline font-medium text-gray-800 dark:text-gray-100" aria-label="Перейти к уровню {{.Name}}">{{.Name}}</a>
                <span class="text-sm text-gray-500 dark:text-gray-400 ml-2">(позиция: <span class="position-badge">{{.Position}}</span>)</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <a href="/games/{{$.GameID}}/levels/{{.ID}}/edit" class="btn btn-outline text-xs" aria-label="Редактировать уровень {{.Name}}">✎</a>
                <a href="/games/{{$.GameID}}/levels/{{.ID}}/questions" class="btn btn-outline text-xs">Вопросы</a>
                <button type="button" data-action="duplicate" data-level-id="{{.ID}}" class="btn btn-primary text-xs" aria-label="Дублировать уровень {{.Name}}">Дублировать</button>
                <button type="button" data-action="move-up" data-level-id="{{.ID}}" class="btn btn-outline text-xs px-2 py-1" aria-label="Переместить уровень {{.Name}} вверх" title="Вверх">↑</button>
                <button type="button" data-action="move-down" data-level-id="{{.ID}}" class="btn btn-outline text-xs px-2 py-1" aria-label="Переместить уровень {{.Name}} вниз" title="Вниз">↓</button>
                <button type="button" data-action="delete" data-level-id="{{.ID}}" class="btn btn-danger text-xs" aria-label="Удалить уровень {{.Name}}">Удалить</button>
            </div>
        </div>
        {{end}}
    </div>
    {{else}}
    <div class="card text-center py-12" role="status">
        <p class="text-gray-500 dark:text-gray-400">Уровней пока нет.</p>
        <p class="mt-2 text-sm text-gray-400"><a href="/games/{{.GameID}}/levels/new" class="text-blue-600 dark:text-blue-400 hover:underline">Создайте первый уровень</a></p>
    </div>
    {{end}}

    <div class="mt-6">
        <a href="/games/{{.GameID}}" class="btn btn-outline text-sm" aria-label="Вернуться к игре">← Назад к игре</a>
    </div>
</div>

<script nonce="{{.csp_nonce}}">
function moveLevel(gameId, levelId, direction) {
    fetch('/games/' + gameId + '/levels/' + levelId + '/move', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: '_csrf={{.csrf}}&direction=' + direction
    }).then(function(r) {
        if (r.ok || r.redirected) window.location.reload();
        else window.showToast('Ошибка перемещения', 'error');
    }).catch(function() { window.showToast('Ошибка сети', 'error'); });
}

function deleteLevel(gameId, levelId) {
    if (!confirm('Удалить уровень?')) return;
    fetch('/games/' + gameId + '/levels/' + levelId + '/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: '_csrf={{.csrf}}'
    }).then(function(r) {
        if (r.ok || r.redirected) window.location.reload();
        else window.showToast('Ошибка удаления', 'error');
    }).catch(function() { window.showToast('Ошибка сети', 'error'); });
}

function duplicateLevel(gameId, levelId) {
    fetch('/games/' + gameId + '/levels/' + levelId + '/duplicate', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: '_csrf={{.csrf}}'
    }).then(function(r) {
        if (r.ok || r.redirected) window.location.reload();
        else window.showToast('Ошибка дублирования', 'error');
    }).catch(function() { window.showToast('Ошибка сети', 'error'); });
}

// CSP-compliant event binding
(function() {
    var list = document.getElementById('level-list');
    if (!list) return;
    var gameId = list.getAttribute('data-game-id');

    // Button actions via event delegation (data-action + data-level-id)
    list.addEventListener('click', function(e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var levelId = btn.getAttribute('data-level-id');
        if (!levelId) return;

        switch (action) {
            case 'duplicate': duplicateLevel(gameId, levelId); break;
            case 'move-up': moveLevel(gameId, levelId, 'up'); break;
            case 'move-down': moveLevel(gameId, levelId, 'down'); break;
            case 'delete': deleteLevel(gameId, levelId); break;
        }
    });

    // Drag and drop sorting via event delegation
    var dragSrcEl = null;

    list.addEventListener('dragstart', function(e) {
        var el = e.target.closest('[draggable]');
        if (!el) return;
        dragSrcEl = el;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', '');
    });

    list.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var target = e.target.closest('[draggable]');
        if (target && target !== dragSrcEl) {
            target.style.borderBottom = '2px solid #3B82F6';
        }
    });

    list.addEventListener('dragleave', function(e) {
        var target = e.target.closest('[draggable]');
        if (target) {
            target.style.borderBottom = '';
        }
    });

    list.addEventListener('dragend', function() {
        var items = list.querySelectorAll('[draggable]');
        for (var i = 0; i < items.length; i++) {
            items[i].style.borderBottom = '';
        }
    });

    list.addEventListener('drop', function(e) {
        e.preventDefault();
        if (!dragSrcEl) return;
        var target = e.target.closest('[draggable]');
        if (target && target !== dragSrcEl) {
            // Cleanup visual styles
            var items = list.querySelectorAll('[draggable]');
            for (var i = 0; i < items.length; i++) {
                items[i].style.borderBottom = '';
            }
            var fromId = dragSrcEl.getAttribute('data-level-id');
            var toId = target.getAttribute('data-level-id');
            fetch('/games/' + gameId + '/levels/' + fromId + '/move-to/' + toId, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: '_csrf={{.csrf}}'
            }).then(function(r) {
                if (r.ok || r.redirected) window.location.reload();
                else window.showToast('Ошибка сортировки', 'error');
            });
        }
    });
})();
</script>
{{end}}
