{{define "skeleton-table"}}
{{/* Usage: {{template "skeleton-table" $rowCount}} — renders animated placeholder rows */}}
{{$rows := . | default 5}}
{{range $i := loop 1 $rows}}
<tr aria-hidden="true">
    <td class="px-6 py-3 whitespace-nowrap" colspan="99">
        {{if eq (mod $i 3) 0}}
        <div class="skeleton h-5 w-1/2 rounded"></div>
        {{else if eq (mod $i 3) 1}}
        <div class="skeleton h-5 w-4/5 rounded"></div>
        {{else}}
        <div class="skeleton h-5 w-3/5 rounded"></div>
        {{end}}
    </td>
</tr>
{{end}}
{{end}}
